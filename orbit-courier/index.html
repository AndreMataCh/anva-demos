<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Orbit Courier: Last Light</title><style>
:root{--bg:#081521;--mint:#8fffe0;--gold:#ffd166;--pink:#ff6b9a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 110%,#173449,var(--bg) 65%);color:#f5fbff;font:600 16px system-ui;min-height:100dvh;display:grid;place-items:center;overflow:hidden}main{width:min(100vw,520px);padding:12px;text-align:center}.top{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;color:var(--mint)}h1{font-size:clamp(24px,7vw,38px);margin:4px 0;letter-spacing:-1px}.sub{font-size:12px;opacity:.7}canvas{display:block;width:100%;aspect-ratio:4/5;border:1px solid #58b9b755;border-radius:20px;background:#091a27;box-shadow:0 10px 70px #53e8dc22;touch-action:none}.buttons{display:flex;gap:8px;margin-top:10px}.buttons button{flex:1}button{border:0;border-radius:12px;padding:12px 10px;background:var(--mint);color:#08212a;font-weight:900;font-size:14px;cursor:pointer}.buttons button:nth-child(2){background:#254454;color:white}.buttons button:nth-child(3){background:#ffd166}.hint{font-size:11px;opacity:.65;margin-top:8px}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#152d39;padding:10px 18px;border-radius:20px;display:none}</style></head><body><main><div class="top"><span>ANVA ARCADE</span><span id="best">RECORD 0</span></div><h1>ORBIT COURIER</h1><div class="sub">LAST LIGHT · DELIVER BEFORE THE STAR GOES OUT</div><canvas id="c" width="480" height="600"></canvas><div class="buttons"><button id="start">START RUN</button><button id="revive">WATCH AD · REVIVE</button><button id="shop">STAR PASS $1.99</button></div><div class="hint">Mouse / touch to steer · WASD or ← → · collect 5 sparks for a shield</div></main><div class="toast" id="toast"></div><script>
(()=>{'use strict';const c=document.querySelector('#c'),x=c.getContext('2d'),W=c.width,H=c.height;window.ANVA=window.ANVA||{};window.ANVA.ads=window.ANVA.ads||{interstitial:async()=>false,rewarded:async()=>false};window.ANVA.iap=window.ANVA.iap||{purchase:async sku=>{console.log('IAP adapter required:',sku);return false}};let state='ready',ship={x:W/2,y:H-85},rocks=[],sparks=[],fx=[],score=0,best=+(localStorage.orbitBest||0),speed=3,frame=0,combo=0,shield=0,last=0,move=0,hasRevived=false;document.querySelector('#best').textContent='RECORD '+best;
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}function reset(){state='run';rocks=[];sparks=[];fx=[];score=0;speed=3;frame=0;combo=0;shield=0;hasRevived=false;ship.x=W/2;last=performance.now();requestAnimationFrame(loop)}function burst(px,py,col,n=12){for(let i=0;i<n;i++)fx.push({x:px,y:py,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:30+Math.random()*20,col})}
function loop(t){if(state!=='run')return;let dt=Math.min(2,(t-last)/16.67);last=t;frame+=dt;score+=dt*speed*.045;speed=3+Math.min(6,score/180);ship.x=Math.max(28,Math.min(W-28,ship.x+move*6*dt));if(frame>Math.max(20,47-speed*2)){frame=0;let xx=35+Math.random()*(W-70);rocks.push({x:xx,y:-30,r:13+Math.random()*12,kind:Math.random()<.25?'spark':'rock',v:speed+Math.random()*2})}
x.clearRect(0,0,W,H);x.fillStyle='#d6fff8';for(let i=0;i<28;i++){let sx=(i*107)%W,sy=(i*79+performance.now()*.035)%H;x.globalAlpha=.18+(i%4)*.14;x.fillRect(sx,sy,2,2)}x.globalAlpha=1;
for(let r of rocks){r.y+=r.v*dt;x.beginPath();x.fillStyle=r.kind==='spark'?'#ffd166':'#ff6b9a';x.shadowBlur=15;x.shadowColor=x.fillStyle;x.arc(r.x,r.y,r.r,0,7);x.fill();x.shadowBlur=0;if(Math.hypot(r.x-ship.x,r.y-ship.y)<r.r+15){if(shield){shield=0;burst(r.x,r.y,'#8fffe0',24);r.y=H+50;toast('SHIELD SPENT!');}else{burst(ship.x,ship.y,'#ff6b9a',30);state='over';best=Math.max(best,Math.floor(score));localStorage.orbitBest=best;document.querySelector('#best').textContent='RECORD '+best;drawOverlay();return}}if(r.kind==='spark'&&Math.abs(r.y-ship.y)<22&&Math.abs(r.x-ship.x)<24){r.y=H+60;combo++;score+=15*combo;if(combo%5===0){shield=1;toast('5 SPARKS: SHIELD CHARGED')}burst(r.x,r.y,'#ffd166',12)} }
rocks=rocks.filter(r=>r.y<H+35);for(let f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt;x.globalAlpha=Math.max(0,f.life/40);x.fillStyle=f.col;x.fillRect(f.x,f.y,4,4)}fx=fx.filter(f=>f.life>0);x.globalAlpha=1;
x.save();x.translate(ship.x,ship.y);x.fillStyle=shield?'#8fffe0':'#fff';x.shadowBlur=shield?25:12;x.shadowColor='#8fffe0';x.beginPath();x.moveTo(0,-19);x.lineTo(15,15);x.lineTo(0,9);x.lineTo(-15,15);x.closePath();x.fill();x.restore();x.shadowBlur=0;x.fillStyle='white';x.font='bold 20px system-ui';x.fillText('DISTANCE '+Math.floor(score),18,34);x.fillStyle='#ffd166';x.fillText('×'+(1+combo),W-72,34);if(shield){x.strokeStyle='#8fffe0';x.lineWidth=2;x.beginPath();x.arc(ship.x,ship.y,25,0,7);x.stroke()}requestAnimationFrame(loop)}
function drawOverlay(){x.fillStyle='#06111ddd';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff';x.font='900 37px system-ui';x.fillText('SIGNAL LOST',W/2,H/2-18);x.font='bold 20px system-ui';x.fillStyle='#8fffe0';x.fillText('DISTANCE '+Math.floor(score)+' · RECORD '+best,W/2,H/2+22);x.font='15px system-ui';x.fillStyle='#fff';x.fillText('One more delivery?',W/2,H/2+58);x.textAlign='left'}
function aim(e){let b=c.getBoundingClientRect();ship.x=(e.clientX-b.left)/b.width*W}c.addEventListener('pointermove',e=>{if(state==='run')aim(e)});window.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))move=-1;if(['ArrowRight','d','D'].includes(e.key))move=1});window.addEventListener('keyup',()=>move=0);document.querySelector('#start').onclick=reset;document.querySelector('#revive').onclick=async()=>{if(state!=='over'||hasRevived)return toast('REVIVE AVAILABLE AFTER A CRASH');let ok=await window.ANVA.ads.rewarded('orbit-revive');if(ok){hasRevived=true;state='run';ship.x=W/2;rocks=[];shield=1;last=performance.now();requestAnimationFrame(loop)}else toast('AD SDK NOT CONNECTED YET')};document.querySelector('#shop').onclick=async()=>{let ok=await window.ANVA.iap.purchase('orbit-star-pass');toast(ok?'STAR PASS UNLOCKED':'STORE NOT CONNECTED')};window.addEventListener('blur',()=>move=0);drawOverlay();x.fillStyle='#fff';x.textAlign='center';x.font='bold 24px system-ui';x.fillText('TAP START TO LAUNCH',W/2,H/2+105);x.textAlign='left';})();
</script></body></html>
