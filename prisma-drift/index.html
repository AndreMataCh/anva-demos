<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Prisma Drift</title><style>*{box-sizing:border-box}body{margin:0;background:#080b18;color:#f4f7ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(94vw,520px);text-align:center}h1{color:#67f5dc;letter-spacing:.12em;margin:8px}canvas{width:100%;background:radial-gradient(circle,#1b2345,#090d1b);border:1px solid #34456f;border-radius:18px;touch-action:none}button{background:#67f5dc;color:#081018;border:0;border-radius:12px;padding:12px 17px;font-weight:800;margin:5px;cursor:pointer}#stats{display:flex;justify-content:space-around;color:#b9c8ef}.hint{color:#9cadd3;font-size:13px}</style><main><h1>PRISMA DRIFT</h1><div id="stats"><span id="score">Puntos 0</span><span id="best">Récord 0</span><span id="shards">Prismas 0</span></div><canvas id="game" width="480" height="640"></canvas><div><button id="play">JUGAR / REINTENTAR</button><button id="revive">▶ Ver anuncio y continuar</button><button id="shop">Desbloquear paleta $1.99</button></div><div class="hint">Arrastrá el prisma o tocá izquierda/derecha. Esquivá los pulsos. Espacio para impulso.</div></main><script>
(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id);let best=+(localStorage.pdBest||0),shards=+(localStorage.pdShards||0),score=0,alive=false,frame=0,combo=0,shake=0,particles=[],hazards=[],player={x:240,y:535,r:13,v:0},last=0,revived=false;const show=()=>{$('score').textContent='Puntos '+Math.floor(score);$('best').textContent='Récord '+best;$('shards').textContent='Prismas '+shards};window.ANVA=window.ANVA||{};window.ANVA.ads=window.ANVA.ads||{interstitial:async()=>false,rewarded:async()=>false};window.ANVA.iap=window.ANVA.iap||{purchase:async sku=>({ok:false,sku})};function burst(px,py,color,n=16){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:30,color})}function start(){score=0;combo=0;frame=0;hazards=[];particles=[];player.x=240;alive=true;revived=false;last=performance.now();requestAnimationFrame(loop)}function addHazard(){let gap=90+Math.random()*65;hazards.push({y:-30,w:13+Math.random()*10,gap,x:40+Math.random()*(400-gap),speed:2.4+Math.min(score/180,3),passed:false})}function loop(t){if(!alive)return;let dt=Math.min((t-last)/16.67,2);last=t;frame+=dt;score+=dt*.14;if(frame%Math.max(26,65-score/12)<dt)addHazard();x.save();x.clearRect(0,0,480,640);if(shake){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}for(let i=hazards.length-1;i>=0;i--){let h=hazards[i];h.y+=h.speed*dt;x.fillStyle='#ff4d9a';x.shadowBlur=18;x.shadowColor='#ff4d9a';x.fillRect(0,h.y,h.x, h.w);x.fillRect(h.x+h.gap,h.y,480-h.x-h.gap,h.w);x.shadowBlur=0;if(!h.passed&&h.y>player.y){h.passed=true;combo++;score+=combo*2;if(combo%4===0){shards++;localStorage.pdShards=shards;show()}burst(player.x,h.y,'#67f5dc',7)}if(h.y>player.y-player.r&&h.y<player.y+player.r&& (player.x<h.x||player.x>h.x+h.gap)){alive=false;shake=18;burst(player.x,player.y,'#ff4d9a',36);best=Math.max(best,Math.floor(score));localStorage.pdBest=best;show();$('play').textContent='REINTENTAR';if(!revived)window.ANVA.ads.interstitial();break}if(h.y>680)hazards.splice(i,1)}player.x+=player.v*dt;player.x=Math.max(16,Math.min(464,player.x));x.shadowBlur=24;x.shadowColor='#67f5dc';x.fillStyle='#67f5dc';x.beginPath();x.moveTo(player.x,player.y-16);x.lineTo(player.x+14,player.y);x.lineTo(player.x,player.y+16);x.lineTo(player.x-14,player.y);x.closePath();x.fill();x.shadowBlur=0;for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;x.globalAlpha=Math.max(0,p.life/30);x.fillStyle=p.color;x.fillRect(p.x,p.y,4,4);if(p.life<=0)particles.splice(i,1)}x.globalAlpha=1;x.restore();show();if(alive)requestAnimationFrame(loop)}function steer(e){const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*480;player.v=Math.max(-5,Math.min(5,(px-player.x)*.09));player.x=px}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);steer(e)});c.addEventListener('pointermove',e=>{if(e.buttons)steer(e)});document.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')player.v=-4;if(e.code==='ArrowRight'||e.code==='KeyD')player.v=4;if(e.code==='Space'&&alive){player.x=Math.min(464,Math.max(16,player.x+player.v*32));burst(player.x,player.y,'#ffe66d',15)}});document.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code))player.v=0});$('play').onclick=start;$('revive').onclick=async()=>{if(!alive||revived)return;let ok=await window.ANVA.ads.rewarded();if(ok){revived=true;alive=true;player.y=535;last=performance.now();requestAnimationFrame(loop)}};$('shop').onclick=async()=>{let result=await window.ANVA.iap.purchase('prisma_palette_199');if(result&&result.ok)document.body.style.filter='hue-rotate(45deg)'};show();start();})();
</script></html>
